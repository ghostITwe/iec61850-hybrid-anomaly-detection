[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iecad"
version = "0.1.0"
description = "Hybrid unsupervised anomaly detection on the TU Delft IEC 61850 CPPS dataset (v2)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
